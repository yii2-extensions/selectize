---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: ecs

permissions:
  contents: read

jobs:
  easy-coding-standard:
    uses: yii2-framework/actions/.github/workflows/ecs.yml@f0e06ea5cc965cff4431177d448add7b7c98668b # v2.0.1
    with:
      composer-command: require yiisoft/yii2:^22.0@dev
      extensions: bcmath, dom, intl, mbstring, sodium, zlib
      php-version: '["8.3"]'
